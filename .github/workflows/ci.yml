name: Build and Test

on:
  push:
    branches: [ '*' ]
    tags: [ 'v*' ]  # Run on version tags for artifact generation
  pull_request:
    branches: [ main, develop ]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  build-and-test:
    name: Build and Test
    needs: setup
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Full history for Source Link

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Run tests
      run: dotnet test --project tests/HeroCrypt.Tests/HeroCrypt.Tests.csproj --configuration Debug --framework ${{ matrix.framework }} --no-restore --results-directory ./TestResults -- --report-xunit-trx --report-xunit-trx-filename test-results.trx --coverlet --coverlet-output-format cobertura

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
      with:
        files: 'TestResults/*.trx'
        check_name: 'Test Results (${{ matrix.os }} - ${{ matrix.framework }})'

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.framework }}
        path: |
          TestResults/*.trx
          TestResults/coverage.cobertura*.xml
        retention-days: 30

  verify-coverage:
    name: Verify coverage report
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
    - name: Download Linux coverage
      run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name test-results-ubuntu-latest-net10.0 --dir TestResults
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Validate coverage and publish summary
      shell: bash
      run: |
        python3 - <<'PY'
        import glob
        import os
        import xml.etree.ElementTree as ET

        reports = glob.glob('TestResults/coverage.cobertura*.xml')
        if len(reports) != 1:
            raise SystemExit(f'Expected one Cobertura report, found {len(reports)}')

        coverage = ET.parse(reports[0]).getroot()
        if coverage.tag != 'coverage':
            raise SystemExit('Cobertura report has no coverage root element')

        valid = int(coverage.attrib['lines-valid'])
        covered = int(coverage.attrib['lines-covered'])
        rate = float(coverage.attrib['line-rate'])
        if valid <= 0 or not 0 <= covered <= valid or not 0 <= rate <= 1:
            raise SystemExit('Cobertura report contains invalid coverage totals')

        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write(f'## Test coverage\n\n{covered:,} of {valid:,} lines covered ({rate:.1%}).\n')
            summary.write('The Cobertura report is available in the Linux .NET 10 test artifact.\n')
        PY

  code-quality:
    name: Code Quality
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore

    - name: Build (with warnings as errors)
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Check formatting
      run: dotnet format --verify-no-changes --verbosity diagnostic

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v6
      with:
        fetch-depth: 0  # Need full history for comparing commits on push events

    - name: Dependency Review
      uses: actions/dependency-review-action@v4
      with:
        fail-on-severity: high
        allow-licenses: MIT, Apache-2.0
        comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
        # For push events, compare against previous commit
        # For PRs, these are automatically detected
        base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
        head-ref: ${{ github.event_name == 'push' && github.sha || '' }}
