name: Build and Test

on:
  push:
    branches: [ '*' ]
    tags: [ 'v*' ]  # Run on version tags for artifact generation
  pull_request:
    branches: [ main, develop ]
  merge_group:
  workflow_dispatch:

# Cancel in-progress runs for the same workflow and ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  setup:
    name: Extract Build Configuration
    runs-on: ubuntu-latest
    outputs:
      versions: ${{ steps.config.outputs.versions }}
      frameworks: ${{ steps.config.outputs.frameworks }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Extract configuration
        id: config
        uses: ./.github/actions/extract-build-config

  build-and-test:
    name: Build and Test (${{ matrix.os }}, ${{ matrix.framework }})
    needs: setup
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      checks: write
      pull-requests: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        framework: ${{ fromJSON(needs.setup.outputs.frameworks) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Full history for Source Link

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build
      run: dotnet build --configuration Release --no-restore --framework ${{ matrix.framework }}

    - name: Run tests
      run: dotnet test --project tests/HeroCrypt.Tests/HeroCrypt.Tests.csproj --configuration Release --no-build --framework ${{ matrix.framework }} --no-restore --results-directory ./TestResults -- --report-xunit-trx --report-xunit-trx-filename test-results.trx --coverlet --coverlet-output-format cobertura

    - name: Publish test results
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always() && matrix.os == 'ubuntu-latest' && matrix.framework == 'net10.0'
      with:
        files: 'TestResults/*.trx'
        check_name: 'Test Results (${{ matrix.os }} - ${{ matrix.framework }})'

    - name: Upload test results
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: test-results-${{ matrix.os }}-${{ matrix.framework }}
        path: |
          TestResults/*.trx
          TestResults/coverage.cobertura*.xml
        retention-days: 30

  verify-coverage:
    name: Verify coverage report
    needs: build-and-test
    runs-on: ubuntu-latest
    permissions:
      actions: read

    steps:
    - name: Download Linux coverage
      run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name test-results-ubuntu-latest-net10.0 --dir TestResults
      env:
        GH_TOKEN: ${{ github.token }}

    - name: Validate coverage and publish summary
      shell: bash
      run: |
        python3 - <<'PY'
        import glob
        import os
        import xml.etree.ElementTree as ET

        reports = glob.glob('TestResults/coverage.cobertura*.xml')
        if len(reports) != 1:
            raise SystemExit(f'Expected one Cobertura report, found {len(reports)}')

        coverage = ET.parse(reports[0]).getroot()
        if coverage.tag != 'coverage':
            raise SystemExit('Cobertura report has no coverage root element')

        valid = int(coverage.attrib['lines-valid'])
        covered = int(coverage.attrib['lines-covered'])
        rate = float(coverage.attrib['line-rate'])
        if valid <= 0 or not 0 <= covered <= valid or not 0 <= rate <= 1:
            raise SystemExit('Cobertura report contains invalid coverage totals')

        with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
            summary.write(f'## Test coverage\n\n{covered:,} of {valid:,} lines covered ({rate:.1%}).\n')
            summary.write('The Cobertura report is available in the Linux .NET 10 test artifact.\n')
        PY

  code-quality:
    name: Code Quality
    needs: setup
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Restore dependencies
      run: dotnet restore --locked-mode

    - name: Build (with warnings as errors)
      run: dotnet build --configuration Release --no-restore /p:TreatWarningsAsErrors=true

    - name: Check formatting
      run: dotnet format --no-restore --verify-no-changes --verbosity diagnostic

  package-validation:
    name: Validate Release Package (${{ matrix.os }})
    needs: setup
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      RELEASE_VERSION: 1.0.0-ci
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Setup .NET SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}

    - name: Test package validation gates
      run: python -m unittest discover -s scripts -p 'test_release_validation.py' -v

    - name: Restore locked dependencies and fail closed on audit errors
      run: |
        cat > "$RUNNER_TEMP/release-nuget.config" <<'XML'
        <configuration>
          <packageSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></packageSources>
          <auditSources><clear/><add key="nuget.org" value="https://api.nuget.org/v3/index.json"/></auditSources>
        </configuration>
        XML
        dotnet restore src/HeroCrypt/HeroCrypt.csproj --locked-mode --force --no-http-cache --configfile "$RUNNER_TEMP/release-nuget.config" -p:NuGetAudit=true -p:NuGetAuditMode=all -p:NuGetAuditLevel=low -p:TreatWarningsAsErrors=true
        git diff --exit-code

    - name: Build, pack, validate and reproduce the Release payload
      run: |
        for iteration in first second; do
          dotnet build src/HeroCrypt/HeroCrypt.csproj --configuration Release --no-restore --no-incremental -p:GeneratePackageOnBuild=false -p:ContinuousIntegrationBuild=true "-p:Version=$RELEASE_VERSION" "-p:PackageVersion=$RELEASE_VERSION" "-p:RepositoryCommit=$GITHUB_SHA"
          dotnet pack src/HeroCrypt/HeroCrypt.csproj --configuration Release --no-build --no-restore --output "$RUNNER_TEMP/$iteration" -p:ContinuousIntegrationBuild=true "-p:PackageVersion=$RELEASE_VERSION" "-p:Version=$RELEASE_VERSION" "-p:RepositoryCommit=$GITHUB_SHA"
          python scripts/release_validation.py validate "$RUNNER_TEMP/$iteration/HeroCrypt.$RELEASE_VERSION.nupkg" "$RUNNER_TEMP/$iteration/HeroCrypt.$RELEASE_VERSION.snupkg" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        done
        for extension in nupkg snupkg; do
          python scripts/release_validation.py compare "$RUNNER_TEMP/first/HeroCrypt.$RELEASE_VERSION.$extension" "$RUNNER_TEMP/second/HeroCrypt.$RELEASE_VERSION.$extension"
        done
        git diff --exit-code

    - name: Smoke-test packaged public APIs on each runtime
      run: python scripts/release_smoke.py "$RUNNER_TEMP/first" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA"

    - name: Upload validated package artifacts
      uses: actions/upload-artifact@v7
      with:
        name: validated-release-packages-${{ matrix.os }}
        path: ${{ runner.temp }}/first/*
        if-no-files-found: error
        retention-days: 14

  rc2-consumer:
    name: RC2 consumer (linux-x64 JIT and NativeAOT)
    needs: package-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RC_SDK: 11.0.100-rc.2.26504.105
      RC_RUNTIME: 11.0.0-rc.2.26504.105
      RELEASE_VERSION: 1.0.0-ci
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
    - name: Checkout exact package source
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Download this run's stable-built Linux package
      uses: actions/download-artifact@v8
      with:
        name: validated-release-packages-ubuntu-latest
        path: ${{ runner.temp }}/rc2-packages
    - name: Setup exact official RC2 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.RC_SDK }}
    - name: Verify exact source and package identity
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/rc2-evidence"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python scripts/release_validation.py validate "$RUNNER_TEMP/rc2-packages/HeroCrypt.$RELEASE_VERSION.nupkg" "$RUNNER_TEMP/rc2-packages/HeroCrypt.$RELEASE_VERSION.snupkg" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        python - <<'PY'
        import hashlib, json, os, platform, subprocess
        from pathlib import Path
        package = Path(os.environ["RUNNER_TEMP"]) / "rc2-packages" / ("HeroCrypt." + os.environ["RELEASE_VERSION"] + ".nupkg")
        digest = hashlib.sha256(package.read_bytes()).hexdigest()
        record = {key: os.environ.get(key) for key in ("GITHUB_SHA", "GITHUB_REF", "GITHUB_EVENT_NAME", "PR_HEAD_SHA", "PR_BASE_SHA", "RC_SDK", "RC_RUNTIME", "RELEASE_VERSION", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}
        record.update(package_id="HeroCrypt", package_sha256=digest, tree=subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), os=platform.platform(), rid="linux-x64", scope="RC2 Linux x64 consumer only; not GA, all-OS or WASM; no publication")
        (Path(os.environ["RUNNER_TEMP"]) / "rc2-evidence/identity.json").write_text(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_ENV"], "a") as stream:
            stream.write("PACKAGE_SHA256=" + digest + "\n")
        print(json.dumps(record, indent=2))
        PY
    - name: Execute RC2 JIT and native consumers with negative controls
      shell: bash
      run: |
        set -euo pipefail
        dotnet_path="$(realpath "$(command -v dotnet)")"
        (cd "$RUNNER_TEMP" && "$dotnet_path" --info) | tee "$RUNNER_TEMP/rc2-evidence/toolchain.log"
        common=("$RUNNER_TEMP/rc2-packages" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --sha256 "$PACKAGE_SHA256" --framework net11.0 --dotnet "$dotnet_path" --sdk-version "$RC_SDK" --runtime-version "$RC_RUNTIME" --verify-execution)
        python scripts/release_smoke.py "${common[@]}" 2>&1 | tee "$RUNNER_TEMP/rc2-evidence/jit.log"
        python scripts/release_smoke.py "${common[@]}" --aot --rid linux-x64 2>&1 | tee "$RUNNER_TEMP/rc2-evidence/aot.log"
        git diff --exit-code
    - name: Retain RC2 consumer evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rc2-consumer-evidence-linux-x64
        path: ${{ runner.temp }}/rc2-evidence/
        if-no-files-found: warn
        retention-days: 14

  rc2-windows-consumer:
    name: RC2 consumer (win-x64 managed JIT)
    needs: package-validation
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      RC_SDK: 11.0.100-rc.2.26504.105
      RC_RUNTIME: 11.0.0-rc.2.26504.105
      RELEASE_VERSION: 1.0.0-ci
      PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
    - name: Checkout exact package source
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Download this run's stable-built Windows package
      uses: actions/download-artifact@v8
      with:
        name: validated-release-packages-windows-latest
        path: ${{ runner.temp }}/windows-rc2-packages
    - name: Setup exact official RC2 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.RC_SDK }}
    - name: Verify exact source and package identity
      shell: bash
      run: |
        mkdir -p "$RUNNER_TEMP/windows-rc2-evidence"
        test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
        python scripts/release_validation.py validate "$RUNNER_TEMP/windows-rc2-packages/HeroCrypt.$RELEASE_VERSION.nupkg" "$RUNNER_TEMP/windows-rc2-packages/HeroCrypt.$RELEASE_VERSION.snupkg" --version "$RELEASE_VERSION" --commit "$GITHUB_SHA" --repository "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
        python - <<'PY'
        import hashlib, json, os, platform, subprocess
        from pathlib import Path
        package = Path(os.environ["RUNNER_TEMP"]) / "windows-rc2-packages" / ("HeroCrypt." + os.environ["RELEASE_VERSION"] + ".nupkg")
        digest = hashlib.sha256(package.read_bytes()).hexdigest()
        record = {key: os.environ.get(key) for key in ("GITHUB_SHA", "GITHUB_REF", "GITHUB_EVENT_NAME", "PR_HEAD_SHA", "PR_BASE_SHA", "RC_SDK", "RC_RUNTIME", "RELEASE_VERSION", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT")}
        record.update(package_id="HeroCrypt", package_sha256=digest, tree=subprocess.check_output(["git", "rev-parse", "HEAD^{tree}"], text=True).strip(), os=platform.platform(), rid="win-x64", scope="RC2 Windows x64 managed JIT consumer only; not GA, all-OS or WASM; no publication")
        (Path(os.environ["RUNNER_TEMP"]) / "windows-rc2-evidence/identity.json").write_text(json.dumps(record, indent=2))
        with open(os.environ["GITHUB_ENV"], "a") as stream:
            stream.write("PACKAGE_SHA256=" + digest + "\n")
        print(json.dumps(record, indent=2))
        PY
    - name: Execute Windows RC2 JIT consumer with negative controls
      shell: bash
      run: |
        python - <<'PYTHON'
        import os, re, shutil, subprocess, sys
        from pathlib import Path
        root = Path(os.environ["RUNNER_TEMP"])
        dotnet = str(Path(shutil.which("dotnet")).resolve())
        info = subprocess.check_output([dotnet, "--info"], cwd=root, text=True)
        (root / "windows-rc2-evidence/toolchain.log").write_text(info)
        print(info, flush=True)
        if not re.search(r"(?m)^\s*RID:\s*win-x64\s*$", info):
            raise SystemExit("Expected Windows x64 SDK host RID")
        command = [sys.executable, "scripts/release_smoke.py", str(root / "windows-rc2-packages"),
                   "--version", os.environ["RELEASE_VERSION"], "--commit", os.environ["GITHUB_SHA"],
                   "--sha256", os.environ["PACKAGE_SHA256"], "--framework", "net11.0", "--dotnet", dotnet,
                   "--sdk-version", os.environ["RC_SDK"], "--runtime-version", os.environ["RC_RUNTIME"],
                   "--verify-execution"]
        with (root / "windows-rc2-evidence/jit.log").open("w") as log:
            result = subprocess.run(command, stdout=log, stderr=subprocess.STDOUT)
        print((root / "windows-rc2-evidence/jit.log").read_text(), flush=True)
        if result.returncode:
            raise SystemExit(result.returncode)
        PYTHON
        git diff --exit-code
    - name: Retain Windows RC2 consumer evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rc2-consumer-evidence-win-x64
        path: ${{ runner.temp }}/windows-rc2-evidence/
        if-no-files-found: warn
        retention-days: 14

  rc2-full-suite:
    name: RC2 full suite (linux-x64 runtime)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RC_SDK: 11.0.100-rc.2.26504.105
      RC_RUNTIME: 11.0.0-rc.2.26504.105
    steps:
    - name: Checkout exact test source
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup stable build SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}
    - name: Build complete test assembly with locked stable dependencies
      run: |
        dotnet --version
        dotnet restore tests/HeroCrypt.Tests/HeroCrypt.Tests.csproj --locked-mode -p:NuGetAudit=true -p:NuGetAuditMode=all -p:TreatWarningsAsErrors=true
        dotnet build tests/HeroCrypt.Tests/HeroCrypt.Tests.csproj --configuration Release --no-restore --framework net10.0
    - name: Setup exact official RC2 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.RC_SDK }}
    - name: Execute complete suite on exact RC2 runtime
      shell: bash
      run: |
        python scripts/rc_full_tests.py --dotnet "$(realpath "$(command -v dotnet)")" --sdk-version "$RC_SDK" --runtime-version "$RC_RUNTIME" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/rc2-full-suite"
        git diff --exit-code
    - name: Retain full RC2 suite evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rc2-full-suite-linux-x64
        path: ${{ runner.temp }}/rc2-full-suite/
        if-no-files-found: warn
        retention-days: 14

  rc2-compiler:
    name: RC2 compiler (linux-x64 original TFMs)
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      RC_SDK: 11.0.100-rc.2.26504.105
      RC_RUNTIME: 11.0.0-rc.2.26504.105
    steps:
    - name: Checkout exact compiler source
      uses: actions/checkout@v7
      with:
        persist-credentials: false
    - name: Setup existing target SDKs
      uses: ./.github/actions/setup-dotnet-sdks
      with:
        dotnet-version: ${{ needs.setup.outputs.versions }}
    - name: Setup exact official RC2 SDK
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: ${{ env.RC_SDK }}
    - name: Compile original TFMs and execute complete suite
      shell: bash
      run: |
        python scripts/rc_compile_tests.py --dotnet "$(realpath "$(command -v dotnet)")" --sdk-version "$RC_SDK" --runtime-version "$RC_RUNTIME" --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/rc2-compiler"
        git diff --exit-code
    - name: Retain RC2 compiler evidence
      if: always()
      uses: actions/upload-artifact@v7
      with:
        name: rc2-compiler-linux-x64
        path: ${{ runner.temp }}/rc2-compiler/
        if-no-files-found: warn
        retention-days: 14

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        fetch-depth: 0  # Need full history for comparing commits on push events

    - name: Dependency Review
      uses: actions/dependency-review-action@v5
      with:
        fail-on-severity: high
        allow-licenses: MIT, Apache-2.0
        comment-summary-in-pr: ${{ github.event_name == 'pull_request' && 'always' || 'never' }}
        # For push events, compare against previous commit
        # For PRs, these are automatically detected
        base-ref: ${{ github.event_name == 'push' && github.event.before || '' }}
        head-ref: ${{ github.event_name == 'push' && github.sha || '' }}

  netstandard-clear-consumer:
    name: netstandard2.0 memory-clear consumer (.NET 10 host)
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup .NET SDKs
        uses: ./.github/actions/setup-dotnet-sdks
        with:
          dotnet-version: ${{ needs.setup.outputs.versions }}

      - name: Build the netstandard2.0 library with locked dependencies
        run: |
          dotnet restore src/HeroCrypt/HeroCrypt.csproj --locked-mode
          dotnet build src/HeroCrypt/HeroCrypt.csproj --configuration Release --framework netstandard2.0 --no-restore -p:GeneratePackageOnBuild=false

      - name: Build .NET 10 consumer against the exact netstandard2.0 DLL
        run: |
          dotnet restore tests/HeroCrypt.NetstandardClearConsumer/HeroCrypt.NetstandardClearConsumer.csproj
          dotnet build tests/HeroCrypt.NetstandardClearConsumer/HeroCrypt.NetstandardClearConsumer.csproj --configuration Release --no-restore

      - name: Cross-check digest, zeroization, and forced-collection regression
        shell: bash
        run: |
          dotnet run --project tests/HeroCrypt.NetstandardClearConsumer/HeroCrypt.NetstandardClearConsumer.csproj --configuration Release --no-build --no-restore | tee "$RUNNER_TEMP/netstandard-clear-consumer.json"
          git diff --exit-code

      - name: Retain raw assembly identity and per-call GC evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netstandard-clear-consumer-evidence
          path: ${{ runner.temp }}/netstandard-clear-consumer.json
          if-no-files-found: warn
          retention-days: 30
